name: Atualizar Dashboard CVM

on:
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * 1-5'

jobs:
  atualizar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install pandas requests

      - name: Baixar cotas da CVM
        run: python coletar_cotas.py

      - name: Gerar dashboard
        run: python gerar_dashboard.py

            - name: Mover para pasta docs
        run: |
          mkdir -p docs
          find . -name "dashboard_cvm_2026.html" | head -1 | xargs -I{} cp {} docs/index.html
          ls docs/

      
          
    

      - name: Commit dashboard
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Atualiza dashboard $(date +'%d/%m/%Y %H:%M')" || echo "Nada a commitar"
          git push
